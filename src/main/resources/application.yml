server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods: ["GET", "POST", "PUT", "PATCH", "DELETE", "OPTIONS"]
            allowedHeaders: ["*"]
            allowCredentials: true
            maxAge: 3600

      routes:
        - id: chat-service-uploads
          uri: ${CHAT_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/uploads/chat/**

        - id: user-service-uploads
          uri: ${USER_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/uploads/**

        - id: task-service-uploads
          uri: ${TASK_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/task-uploads/**

        - id: support-service
          uri: ${USER_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/support/**

        - id: user-service
          uri: ${USER_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/auth/**, /api/users/**, /api/ads/**, /api/admin/**, /api/profile/**, /api/leaderboard/**, /api/notifications/**, /api/portfolio/**, /api/university/**, /api/workspace/**

        - id: task-service
          uri: ${TASK_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/tasks/**, /api/reviews/**

        - id: chat-service
          uri: ${CHAT_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/chats/**, /ws/**

        - id: university-service
          uri: ${UNIVERSITY_SERVICE_URL:http://localhost:8085}
          predicates:
            - Path=/api/universities/**

        - id: payment-service
          uri: ${PAYMENT_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/payments/**, /api/finance/**

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
      password: ${REDIS_PASSWORD:studex_redis}

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    ru.studex: DEBUG
